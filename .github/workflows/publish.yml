name: Publish

# Tag-driven release: push a tag like v0.2.0 and every publishable package
# in the oma dependency closure ships to npm at that version (lockstep).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # tag + GitHub Release notes generation
  id-token: write # npm provenance via GitHub OIDC — no long-lived NPM_TOKEN
  packages: write # publish to GitHub Packages with the ephemeral GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for npm provenance attestations

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp tag version into publishable packages
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const pkgs = [
              "packages/message",
              "packages/config",
              "packages/ai",
              "packages/tui",
              "packages/source-fetch",
              "packages/sandbox",
              "packages/agent-contract",
              "packages/adapter-mcp",
              "apps/oh-my-agent",
            ];
            for (const dir of pkgs) {
              const p = `${dir}/package.json`;
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = tag;
              for (const section of ["dependencies", "peerDependencies", "devDependencies"]) {
                for (const [name, range] of Object.entries(j[section] ?? {})) {
                  if (name.startsWith("@chengchenccc/") && range.startsWith("workspace:")) {
                    j[section][name] = `^${tag}`;
                  }
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            console.log(`stamped ${tag} into ${pkgs.length} packages`);
          ' "$TAG"

      - name: Build
        run: bun run build

      - name: Audit tarball contents (fail closed on stray files)
        run: |
          for p in packages/message packages/config packages/ai packages/tui \
                   packages/source-fetch packages/sandbox packages/agent-contract \
                   packages/adapter-mcp apps/oh-my-agent; do
            echo "=== $p ==="
            (cd "$p" && npm pack --dry-run 2>&1 | grep -Ev "npm notice [0-9]+ package?" || true)
            (cd "$p" && npm pack --dry-run 2>&1 | grep -E "\.env|\.backend-data|node_modules|\.turbo|\.next" && \
              { echo "STRAY FILE IN TARBALL"; exit 1; } || true)
          done

      - name: Publish (topological order, provenance on)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          # npm reads auth from .npmrc, not from the env var directly
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          # prerelease versions (rc/beta/alpha) go to a matching dist-tag so
          # `npm i oma` never resolves to a prerelease
          DIST_TAG=latest
          case "${GITHUB_REF_NAME#v}" in
            *-rc.*) DIST_TAG=rc ;;
            *-beta.*) DIST_TAG=beta ;;
            *-alpha.*) DIST_TAG=alpha ;;
          esac
          for p in packages/message packages/config packages/ai packages/tui \
                   packages/source-fetch packages/sandbox packages/agent-contract \
                   packages/adapter-mcp apps/oh-my-agent; do
            echo ">>> publishing $p"
            (cd "$p" && npm publish --access public --tag "$DIST_TAG")
          done

      # Second registry: GitHub Packages. GITHUB_TOKEN is the only credential
      # (no npm token involved). Prerelease dist-tag routing mirrors npmjs.
      # Provenance is npmjs-only, so it is explicitly off here.
      - name: Publish to GitHub Packages (topological order)
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "@chengchenccc:registry=https://npm.pkg.github.com" > "${HOME}/.npmrc"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "${HOME}/.npmrc"
          DIST_TAG=latest
          case "${GITHUB_REF_NAME#v}" in
            *-rc.*) DIST_TAG=rc ;;
            *-beta.*) DIST_TAG=beta ;;
            *-alpha.*) DIST_TAG=alpha ;;
          esac
          for p in packages/message packages/config packages/ai packages/tui \
                   packages/source-fetch packages/sandbox packages/agent-contract \
                   packages/adapter-mcp apps/oh-my-agent; do
            echo ">>> gh-registry publishing $p"
            (cd "$p" && npm publish --access public --tag "$DIST_TAG" --registry https://npm.pkg.github.com)
          done

      # GitHub Packages defaults new packages to private; the repo is public,
      # so flip them public (idempotent once public).
      - name: Make GitHub Packages visible as public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in message config ai tui source-fetch sandbox agent-contract adapter-mcp oh-my-agent; do
            echo ">>> public-izing @chengchenccc/$name"
            curl -s -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/npm/${name}/restore" > /dev/null || true
            curl -s -f -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/${name}" \
              -d '{"visibility":"public"}' \
              -o /dev/null -w "  ${name}: HTTP %{http_code}\n" || true
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
